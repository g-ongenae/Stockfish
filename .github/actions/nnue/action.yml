# Puts the default NNUE network (138 MB) in src/, restoring it from the cache
# when it is there and downloading it with `make net` otherwise. The cache key
# follows src/evaluate.h, which names the network. A job that needs the network
# (the C++ engine, or the Rust port once it evaluates) adds one step:
#
#   - uses: ./.github/actions/nnue
name: NNUE network
description: Restore or download the default network into src/
runs:
  using: composite
  steps:
    - name: Cache the network
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: src/nn-*.nnue
        key: nnue-${{ hashFiles('src/evaluate.h') }}
    - name: Fetch and validate the network
      shell: bash
      working-directory: src
      # net.sh checks the sha256 of a cached file and downloads it again if it
      # does not match its name
      run: make net
