# CI of the Rust port (rust/): build, unit tests, the differential sample of
# tests/differential on the members rust/differential.env lists, and perft,
# natively on x86-64 and under user-mode emulation on weak or unusual targets.
# Emulation proves correctness on the target's instruction set, word size and
# byte order; it says nothing about speed on real hardware.
name: "Fork: Rust port"

on:
  push:
    branches: [master]
    paths:
      - "rust/**"
      - "tests/differential/**"
      - ".github/workflows/rust.yml"
      - ".github/actions/**"
      - ".github/ci/**"
  pull_request:
    branches: [master]
    paths:
      - "rust/**"
      - "tests/differential/**"
      - ".github/workflows/rust.yml"
      - ".github/actions/**"
      - ".github/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned so that a new release cannot turn CI red by itself; the version of
  # the development machine.
  RUSTUP_TOOLCHAIN: 1.85.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: rust

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal --component rustfmt,clippy
      # rustfmt.toml gives the style of the crate (120 columns).
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        if: always()
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo clippy --features magic32
        if: always()
        run: cargo clippy --all-targets --locked --features magic32 -- -D warnings

  native:
    name: x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal
      - name: Members checked
        run: cat differential.env

      - name: Build
        run: cargo build --release --locked
      - name: cargo test
        run: cargo test --release --locked
      # in a target directory of its own: in target/ it would replace the
      # default binary, which the steps below check
      - name: cargo test --features magic32
        run: cargo test --release --locked --features magic32 --target-dir target/magic32

      # nnue and eval need the network: the port looks for it in the working
      # directory, rust/, from which the harness runs every target
      - uses: ./.github/actions/nnue
      - name: Network for the port
        run: ln -sf ../src/nn-*.nnue . && ls -lL nn-*.nnue

      - name: Differential sample
        run: |
          . ./differential.env
          test -n "$DUMP_FIELDS"
          EXE=$PWD/target/release/stockfish ../.github/ci/verify-sample.sh sample --fields "$DUMP_FIELDS"
      - name: Differential sample (lines of play)
        run: |
          . ./differential.env
          if [ -z "$DUMPLINE_FIELDS" ]; then
            echo "::notice::dumpline is not ported yet (DUMPLINE_FIELDS is empty in rust/differential.env): skipped"
            exit 0
          fi
          EXE=$PWD/target/release/stockfish ../.github/ci/verify-sample.sh lines --fields "$DUMPLINE_FIELDS"
      # The search: its UCI output and its event and state digests on the
      # sample of the search trace (README.md, "The search"), the deepest
      # searches of the full corpus, and the bench signature
      - name: Search trace sample, UCI output
        run: EXE=$PWD/target/release/stockfish ../.github/ci/verify-sample.sh trace-uci
      - name: Search trace sample, events and state
        run: EXE=$PWD/target/release/stockfish ../.github/ci/verify-sample.sh trace
      - name: Deepest searches of the full corpus
        run: ./search_check.sh deep target/release/stockfish
      - name: Bench signature
        run: ./search_check.sh bench target/release/stockfish
      # Overflow and bounds checks, and the debug assertions of C++, on the
      # whole sample of the trace
      - name: Search trace sample, debug build
        run: |
          cargo build --locked
          EXE=$PWD/target/debug/stockfish ../.github/ci/verify-sample.sh trace

      # The move picker beyond what `dump` sees (TT moves, ProbCut,
      # skip_quiet_moves, plies above 0, non-zero histories, legal() on every
      # move value, the history update operator): a C++ driver built against
      # the objects of src/ and the port's driver must print the same (see
      # README.md, "What the gate does not cover"). The output of the C++
      # driver on a subset is kept in movepick_check.expected, for the
      # emulated targets, which cannot run the C++ code: check it here too.
      - name: Build src/ for the C++ driver of the move picker
        working-directory: src
        run: make -j4 ARCH=x86-64-sse41-popcnt build
      - name: Build the two drivers of the move picker
        run: |
          ARCH=x86-64-sse41-popcnt bench/build_movepick_check.sh
          cargo build --release --locked --example movepick_check
      - name: Move picker, C++ against Rust (sample)
        run: |
          EXE=target/cpp/movepick_check ./movepick_check.sh sample > movepick-cpp.txt
          EXE=target/release/examples/movepick_check ./movepick_check.sh sample > movepick-rust.txt
          wc -l movepick-cpp.txt
          cmp movepick-cpp.txt movepick-rust.txt
      # The transposition table beyond the 2 MB of the trace: probes,
      # writes, replacement and ageing at several sizes, the C++ table
      # against the port's (README.md, "The transposition table")
      - name: Transposition table, C++ against Rust
        run: |
          ARCH=x86-64-sse41-popcnt bench/build_tt_check.sh
          cargo build --release --locked --example tt_check
          ./search_check.sh tt target/cpp/tt_check > tt-cpp.txt
          ./search_check.sh tt target/release/examples/tt_check > tt-rust.txt
          wc -l tt-cpp.txt
          cmp tt-cpp.txt tt-rust.txt
          cmp tt-cpp.txt tt_check.expected
      # The time manager against the C++ one: 346,771 calls of init() over
      # clocks, increments, movestogo, plies, Move Overhead, nodestime and
      # Ponder, with advance_nodes_time() between the calls of a game; the
      # same lines, the same bits of originalTimeAdjust (README.md, "Time
      # management")
      - name: Time manager, C++ against Rust
        run: |
          ARCH=x86-64-sse41-popcnt bench/build_tm_check.sh
          cargo build --release --locked --example tm_check
          target/cpp/tm_check doubles > tm-cpp.txt
          target/release/examples/tm_check doubles > tm-rust.txt
          wc -l tm-cpp.txt
          cmp tm-cpp.txt tm-rust.txt
          target/cpp/tm_check digest | cmp - tm_check.expected
          # the arithmetic in software (src/fp.rs), which the i586 targets
          # use, against the same C++ output
          cargo build --release --locked --features softfloat --target-dir target/softfloat --example tm_check
          target/softfloat/release/examples/tm_check doubles | cmp - tm-cpp.txt
      # What the corpus of the trace does not reach, against the C++ engine
      # built above: mates, stalemates, the 50-move rule close to 100,
      # searchmoves, go mate, a search of 11M nodes, the bench positions to
      # depth 18 and 20; the hash sizes, UCI_ShowWDL and MultiPV on part of
      # the sample (README.md, "What the gates do not see"); and searches on
      # a clock under nodestime (README.md, "Time management")
      - name: Search, direct comparisons with the C++ engine
        run: REF=$PWD/../src/stockfish ./search_check.sh compare target/release/stockfish
      - name: Clock sessions, the recorded expected output is the C++ output
        run: |
          mkdir -p clock-expected
          REF=$PWD/../src/stockfish ./search_check.sh clock-record clock-expected
          for f in clock-expected/*.jsonl; do cmp "$f" "tests/search/$(basename "$f")"; done
          ./search_check.sh clock target/release/stockfish
      - name: Move picker, movepick_check.expected is the C++ output
        run: EXE=target/cpp/movepick_check ./movepick_check.sh subset | cmp - movepick_check.expected
      - name: Move picker with magic32
        run: |
          cargo build --release --locked --features magic32 --target-dir target/magic32 --example movepick_check
          EXE=target/magic32/release/examples/movepick_check ./movepick_check.sh subset | cmp - movepick_check.expected

      - name: Perft, full depths of tests/perft.sh
        run: |
          command -v bc || { sudo apt-get update && sudo apt-get install -y bc; }
          ./perft.sh target/release/stockfish

      # the 32-bit magic index arithmetic, on the harness and perft too
      - name: Build with magic32
        run: cargo build --release --locked --features magic32 --target-dir target/magic32
      - name: Differential sample with magic32
        run: |
          . ./differential.env
          EXE=$PWD/target/magic32/release/stockfish ../.github/ci/verify-sample.sh sample --fields "$DUMP_FIELDS"
      - name: Perft with magic32, full depths
        run: ./perft.sh target/magic32/release/stockfish

  emulated:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pentium-class 32-bit x86. The i586 targets emit no cmov, MMX or
          # SSE (the code is scanned for them below).
          # With glibc: Ubuntu's i386 glibc needs cmov (it is built for
          # i686), so this runs on qemu's Pentium model plus cmov: the
          # feature set of the Pentium Pro of the fork's goal (no MMX, no SSE).
          - name: i586 glibc (Pentium Pro, no SSE)
            target: i586-unknown-linux-gnu
            packages: gcc-multilib qemu-user
            linker: gcc
            runner: qemu-i386 -cpu pentium,+cmov
            cmov: ok
            file: "ELF 32-bit LSB.*Intel 80386"
            perft_depth: 5
          # Static with musl, so that nothing but the port, the Rust standard
          # library and musl runs: on qemu's plain Pentium model (no cmov).
          - name: i586 musl static (Pentium, no cmov, no SSE)
            target: i586-unknown-linux-musl
            packages: gcc-multilib qemu-user
            linker: gcc
            runner: qemu-i386 -cpu pentium
            cmov: sigill
            file: "ELF 32-bit LSB.*Intel 80386.*statically linked"
            perft_depth: 5
          # 32-bit ARM, hard float, no NEON (the target's default)
          - name: ARMv7 32-bit
            target: armv7-unknown-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
            linker: arm-linux-gnueabihf-gcc
            runner: qemu-arm -L /usr/arm-linux-gnueabihf
            file: "ELF 32-bit LSB.*ARM"
            perft_depth: 5
          # big-endian, and 32-bit as well
          - name: PowerPC 32-bit big-endian
            target: powerpc-unknown-linux-gnu
            packages: gcc-powerpc-linux-gnu libc6-dev-powerpc-cross qemu-user
            linker: powerpc-linux-gnu-gcc
            runner: qemu-ppc -L /usr/powerpc-linux-gnu
            file: "ELF 32-bit MSB.*PowerPC"
            perft_depth: 5
    env:
      TARGET: ${{ matrix.target }}
      RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }} bc file binutils
          rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal --target $TARGET
          triple=$(echo $TARGET | tr a-z- A-Z_)
          echo "CARGO_TARGET_${triple}_LINKER=${{ matrix.linker }}" >> $GITHUB_ENV
          echo "CARGO_TARGET_${triple}_RUNNER=$RUNNER" >> $GITHUB_ENV
          echo "CARGO_BUILD_TARGET=$TARGET" >> $GITHUB_ENV
          ${RUNNER%% *} --version

      - name: Build
        run: |
          cargo build --release --locked
          exe=target/$TARGET/release/stockfish
          file $exe
          file $exe | grep -E "${{ matrix.file }}"
          echo "EXE=$PWD/$exe" >> $GITHUB_ENV

      # The emulated CPU must reject what the target must not use; otherwise
      # running under it proves nothing. The probes are static programs
      # without libc, so that only the probed instruction can fault.
      - name: The emulated CPU rejects SSE, SSE2 and popcnt (and cmov on the Pentium)
        if: startsWith(matrix.target, 'i586-')
        working-directory: ${{ runner.temp }}
        run: |
          # probe <instruction> <expected: ok|sigill|any>, on the CPU of $RUNNER
          failed=0
          probe() {
            printf '.globl _start\n_start:\n  %s\n  mov $1, %%eax\n  xor %%ebx, %%ebx\n  int $0x80\n' "$1" > p.s
            gcc -m32 -nostdlib -static -o p p.s
            $RUNNER ./p 2>/dev/null && got=ok || { [ $? -eq 132 ] && got=sigill || got=other; }
            echo "$RUNNER: $1: $got, expected $2"
            [ $2 = any ] || [ $got = $2 ] || failed=1
          }
          probe "nop" ok
          probe "cmovl %eax, %ebx" ${{ matrix.cmov }}
          probe "fcmovb %st(1), %st" ${{ matrix.cmov }}
          # qemu 8.2 executes MMX whatever the CPU model: the scan of the next
          # step is what rules MMX out
          probe "paddb %mm0, %mm0" any
          probe "addps %xmm0, %xmm0" sigill
          probe "mulps %xmm1, %xmm0" sigill
          probe "paddq %xmm0, %xmm0" sigill
          probe "addpd %xmm0, %xmm0" sigill
          probe "cvtsi2sd %eax, %xmm0" sigill
          probe "popcnt %eax, %ebx" sigill
          exit $failed
      - name: No instruction beyond the Pentium in the binary
        if: startsWith(matrix.target, 'i586-')
        run: |
          # Also covers code the tests do not execute. With glibc the binary
          # is dynamically linked, so its text is the port and the Rust
          # standard library; with musl it is everything that runs.
          objdump -d --no-show-raw-insn $EXE > disasm.txt
          wc -l disasm.txt
          grep -nE '\s(cmov|fcmov|fcomi|fucomi)[a-z]*\s|%[xy]?mm[0-9]' disasm.txt > bad.txt || true
          if [ -s bad.txt ]; then
            head -20 bad.txt
            echo "::error::$(wc -l < bad.txt) instructions beyond the Pentium (i586) in $EXE"
            exit 1
          fi
          echo "no cmov, fcmov, fcomi, MMX or SSE instruction"

      - name: cargo test (emulated)
        run: cargo test --release --locked
      # nnue and eval need the network: the port looks for it in the working
      # directory, rust/, from which the harness runs every target
      - uses: ./.github/actions/nnue
      - name: Network for the port
        run: ln -sf ../src/nn-*.nnue . && ls -lL nn-*.nnue

      - name: Differential sample (emulated)
        run: |
          . ./differential.env
          test -n "$DUMP_FIELDS"
          RUN_PREFIX="$RUNNER" ../.github/ci/verify-sample.sh sample --fields "$DUMP_FIELDS"
      - name: Differential sample, lines of play (emulated)
        run: |
          . ./differential.env
          if [ -z "$DUMPLINE_FIELDS" ]; then
            echo "::notice::dumpline is not ported yet (DUMPLINE_FIELDS is empty in rust/differential.env): skipped"
            exit 0
          fi
          RUN_PREFIX="$RUNNER" ../.github/ci/verify-sample.sh lines --fields "$DUMPLINE_FIELDS"
      # The output of the C++ driver of the move picker, kept in
      # movepick_check.expected (checked against the C++ code by the x86-64
      # job): the port's driver must print the same on this target
      - name: Move picker against the C++ driver (emulated)
        run: |
          cargo build --release --locked --example movepick_check
          EXE=$PWD/target/$TARGET/release/examples/movepick_check RUN_PREFIX="$RUNNER" ./movepick_check.sh subset \
            | cmp - movepick_check.expected
      # The search under emulation: the whole sample of the search trace
      # (UCI output, then events and state; 2 to 7 minutes per step on these
      # targets), the deepest searches of the full corpus, the transposition
      # table driver against the C++ output kept in tt_check.expected, and the
      # bench signature
      - name: Search trace sample, UCI output (emulated)
        run: RUN_PREFIX="$RUNNER" ../.github/ci/verify-sample.sh trace-uci
      - name: Search trace sample, events and state (emulated)
        run: RUN_PREFIX="$RUNNER" ../.github/ci/verify-sample.sh trace
      - name: Deepest searches of the full corpus (emulated)
        run: RUN_PREFIX="$RUNNER" ./search_check.sh deep $EXE
      - name: Transposition table against the C++ driver (emulated)
        run: |
          cargo build --release --locked --example tt_check
          RUN_PREFIX="$RUNNER" ./search_check.sh tt $PWD/target/$TARGET/release/examples/tt_check | cmp - tt_check.expected
      # The time manager against the C++ digest kept in tm_check.expected
      # (checked against the C++ code by the x86-64 job). Then, for
      # information, how far its doubles are from the port's on x86-64
      # (README.md, "Time management", "Floating point")
      - name: Time manager against the C++ driver (emulated)
        run: |
          cargo build --release --locked --example tm_check
          $RUNNER target/$TARGET/release/examples/tm_check digest | cmp - tm_check.expected
      - name: Time manager, doubles against x86-64 (emulated, information)
        if: always()
        run: |
          cargo build --release --locked --example tm_check --target x86_64-unknown-linux-gnu
          target/x86_64-unknown-linux-gnu/release/examples/tm_check raw > tm-native.txt
          $RUNNER target/$TARGET/release/examples/tm_check raw > tm-target.txt
          python3 bench/tm_doubles.py tm-native.txt tm-target.txt
      # Searches on a clock under nodestime, part of tests/search/clock*,
      # against the C++ output kept in tests/search/*.expected.jsonl
      - name: Searches on a clock (emulated)
        run: RUN_PREFIX="$RUNNER" ./search_check.sh clock $EXE
      - name: Bench signature (emulated)
        run: RUN_PREFIX="$RUNNER" ./search_check.sh bench $EXE
      - name: Perft (emulated), depth ${{ matrix.perft_depth }} at most
        run: |
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$RUNNER" "$EXE" > emulated
          chmod +x emulated
          ./perft.sh ./emulated ${{ matrix.perft_depth }}
