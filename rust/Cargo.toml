[package]
name = "stockfish-port"
version = "0.1.0"
edition = "2021"
description = "Rust port of Stockfish, bit-identical to the C++ engine at 43e01e07"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "stockfish"
path = "src/lib.rs"

[[bin]]
name = "stockfish"
path = "src/main.rs"

# No dependencies on purpose: see README.md.
[dependencies]

[features]
# Use the 32-bit magic index computation on a 64-bit target, to test it.
magic32 = []
# Do the doubles of time management in software on every target (src/fp.rs),
# as the i586 targets do, to test that path.
softfloat = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
# Keep the debug profile usable for perft and the corpus while keeping the
# overflow and bounds checks on.
opt-level = 1
